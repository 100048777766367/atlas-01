name: Atlas-01 Sovereign Lifecycle
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '40 */4 * * *'
permissions:
  contents: write
jobs:
  run-node:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo code
        run: git clone --depth 1 https://github.com/${{ github.repository }}.git .
      - name: Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Chạy kernel
        run: python kernel.py
      - name: Lưu vết Git
        run: |
          git config --global user.name "Atlas-01-Bot"
          git config --global user.email "bot@atlas-01.node"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"
          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🌱 [Atlas-01] Kích hoạt nhịp đập tự trị [skip ci]"
            git push origin "$TARGET_BRANCH"
          fi
